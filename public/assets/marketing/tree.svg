<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="先固定饮品，每组完整列出3种"><rect width="1000" height="480" rx="18" fill="#f6f8f5"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="55" y="66" font-size="30" fill="#273e50">先固定饮品，每组完整列出3种</text><text x="55" y="103" font-size="16" fill="#71828d">饮品2种，主食3种；每次各选一种，共6种搭配。</text><rect x="70" y="190" width="105" height="60" rx="8" fill="#dce9e5"/><text x="95" y="228" font-size="24" fill="#273e50">豆浆</text><path d="M175 220L260 175" stroke="#3a7294" stroke-width="4"/><rect x="260" y="150" width="170" height="50" rx="8" fill="#e4eef4"/><text x="290" y="183" font-size="19" fill="#273e50">豆浆＋馒头</text><path d="M175 220L260 260" stroke="#3a7294" stroke-width="4"/><rect x="260" y="235" width="170" height="50" rx="8" fill="#e4eef4"/><text x="290" y="268" font-size="19" fill="#273e50">豆浆＋面包</text><path d="M175 220L260 345" stroke="#3a7294" stroke-width="4"/><rect x="260" y="320" width="170" height="50" rx="8" fill="#e4eef4"/><text x="290" y="353" font-size="19" fill="#273e50">豆浆＋玉米</text><rect x="540" y="190" width="105" height="60" rx="8" fill="#dce9e5"/><text x="565" y="228" font-size="24" fill="#273e50">牛奶</text><path d="M645 220L730 175" stroke="#3a7294" stroke-width="4"/><rect x="730" y="150" width="170" height="50" rx="8" fill="#e4eef4"/><text x="760" y="183" font-size="19" fill="#273e50">牛奶＋馒头</text><path d="M645 220L730 260" stroke="#3a7294" stroke-width="4"/><rect x="730" y="235" width="170" height="50" rx="8" fill="#e4eef4"/><text x="760" y="268" font-size="19" fill="#273e50">牛奶＋面包</text><path d="M645 220L730 345" stroke="#3a7294" stroke-width="4"/><rect x="730" y="320" width="170" height="50" rx="8" fill="#e4eef4"/><text x="760" y="353" font-size="19" fill="#273e50">牛奶＋玉米</text><text x="55" y="448" font-size="14" fill="#81909b">方法示意 · 本文编写例题，非课堂实拍</text></g></svg>