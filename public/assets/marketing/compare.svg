<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="减差与加差，平分的对象不同"><rect width="1000" height="480" rx="18" fill="#f6f8f5"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="55" y="66" font-size="30" fill="#273e50">减差与加差，平分的对象不同</text><text x="55" y="103" font-size="16" fill="#71828d">两本共28张，第一本比第二本多8张。</text><rect x="55" y="155" width="425" height="220" rx="8" fill="#e4eef4"/><rect x="510" y="155" width="435" height="220" rx="8" fill="#e1ece5"/><text x="80" y="200" font-size="25" fill="#273e50">拿走多的8张</text><text x="80" y="250" font-size="27" fill="#273e50">（28－8）÷2＝10</text><text x="80" y="300" font-size="20" fill="#273e50">平分后：每份是第二本</text><text x="540" y="200" font-size="25" fill="#273e50">给少的补上8张</text><text x="540" y="250" font-size="27" fill="#273e50">（28＋8）÷2＝18</text><text x="540" y="300" font-size="20" fill="#273e50">平分后：每份是第一本</text><text x="55" y="448" font-size="14" fill="#81909b">方法示意 · 本文编写例题，非课堂实拍</text></g></svg>