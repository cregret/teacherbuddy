<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="多出来的4支拿走，两份就一样多"><rect width="1000" height="480" rx="18" fill="#f6f8f5"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="55" y="66" font-size="30" fill="#273e50">多出来的4支拿走，两份就一样多</text><text x="55" y="103" font-size="16" fill="#71828d">两盒共18支，甲比乙多4支；减去差，再平分。</text><text x="65" y="190" font-size="22" fill="#273e50">甲盒</text><rect x="160" y="157" width="420" height="48" rx="8" fill="#e4eef4"/><rect x="580" y="157" width="240" height="48" rx="8" fill="#e9d4af"/><text x="635" y="189" font-size="22" fill="#273e50">多4支</text><text x="65" y="275" font-size="22" fill="#273e50">乙盒</text><rect x="160" y="242" width="420" height="48" rx="8" fill="#e4eef4"/><text x="180" y="340" font-size="28" fill="#273e50">18－4＝14　→　14÷2＝7</text><text x="180" y="388" font-size="21" fill="#273e50">乙盒7支，甲盒11支；7＋11＝18，11－7＝4</text><text x="55" y="448" font-size="14" fill="#81909b">方法示意 · 本文编写例题，非课堂实拍</text></g></svg>