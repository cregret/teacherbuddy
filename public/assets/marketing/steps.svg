<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="听懂之后，留一次独立尝试"><rect width="1000" height="480" rx="18" fill="#f6f8f5"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="55" y="66" font-size="30" fill="#273e50">听懂之后，留一次独立尝试</text><text x="55" y="103" font-size="16" fill="#71828d">两人共24张，甲比乙多6张；先说理由，再写算式。</text><rect x="55" y="165" width="275" height="170" rx="8" fill="#e4eef4"/><text x="77" y="215" font-size="26" fill="#273e50">01 画出来</text><text x="77" y="265" font-size="17" fill="#273e50">把和、差放在同一张图里</text><text x="337" y="250" font-size="25" fill="#273e50">→</text><rect x="365" y="165" width="275" height="170" rx="8" fill="#e2eee7"/><text x="387" y="215" font-size="26" fill="#273e50">02 讲清楚</text><text x="387" y="265" font-size="17" fill="#273e50">为什么拿走差以后能平分</text><text x="647" y="250" font-size="25" fill="#273e50">→</text><rect x="675" y="165" width="275" height="170" rx="8" fill="#e4eef4"/><text x="697" y="215" font-size="26" fill="#273e50">03 换题试</text><text x="697" y="265" font-size="17" fill="#273e50">条件换序，再独立解释</text><text x="130" y="390" font-size="26" fill="#273e50">（24－6）÷2＝9　　甲：9＋6＝15</text><text x="55" y="448" font-size="14" fill="#81909b">方法示意 · 本文编写例题，非课堂实拍</text></g></svg>