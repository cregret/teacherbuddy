<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="绝对值：到原点的距离"><rect width="1000" height="480" rx="18" fill="#f6f8f5"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="55" y="66" font-size="30" fill="#273e50">绝对值：到原点的距离</text><text x="55" y="103" font-size="16" fill="#71828d">距离为3，可能在原点左侧，也可能在右侧。</text><path d="M100 230H900" stroke="#273e50" stroke-width="3"/><path d="M180 222L180 238" stroke="#273e50" stroke-width="2"/><text x="170" y="270" font-size="20" fill="#273e50">-4</text><path d="M260 222L260 238" stroke="#273e50" stroke-width="2"/><text x="250" y="270" font-size="20" fill="#273e50">-3</text><path d="M340 222L340 238" stroke="#273e50" stroke-width="2"/><text x="330" y="270" font-size="20" fill="#273e50">-2</text><path d="M420 222L420 238" stroke="#273e50" stroke-width="2"/><text x="410" y="270" font-size="20" fill="#273e50">-1</text><path d="M500 222L500 238" stroke="#273e50" stroke-width="2"/><text x="490" y="270" font-size="20" fill="#273e50">0</text><path d="M580 222L580 238" stroke="#273e50" stroke-width="2"/><text x="570" y="270" font-size="20" fill="#273e50">1</text><path d="M660 222L660 238" stroke="#273e50" stroke-width="2"/><text x="650" y="270" font-size="20" fill="#273e50">2</text><path d="M740 222L740 238" stroke="#273e50" stroke-width="2"/><text x="730" y="270" font-size="20" fill="#273e50">3</text><path d="M820 222L820 238" stroke="#273e50" stroke-width="2"/><text x="810" y="270" font-size="20" fill="#273e50">4</text><circle cx="260" cy="230" r="9" fill="#3a7294"/><path d="M260 185H500" stroke="#43806c" stroke-width="4"/><text x="342.0" y="165" font-size="20" fill="#43806c">距离3</text><circle cx="740" cy="230" r="9" fill="#3a7294"/><path d="M500 185H740" stroke="#43806c" stroke-width="4"/><text x="582.0" y="165" font-size="20" fill="#43806c">距离3</text><text x="220" y="345" font-size="28" fill="#273e50">|－3|＝3</text><text x="610" y="345" font-size="28" fill="#273e50">|3|＝3</text><text x="265" y="395" font-size="23" fill="#273e50">左右位置不同，到原点的距离相同。</text><text x="55" y="448" font-size="14" fill="#81909b">方法示意 · 本文编写例题，非课堂实拍</text></g></svg>