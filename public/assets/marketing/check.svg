<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="检查时，每一格都要有对应情况"><rect width="1000" height="480" rx="18" fill="#f6f8f5"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="55" y="66" font-size="30" fill="#273e50">检查时，每一格都要有对应情况</text><text x="55" y="103" font-size="16" fill="#71828d">两种颜色 × 三种形状；逐格检查，避免重复和遗漏。</text><text x="65" y="210" font-size="22" fill="#273e50">红色</text><rect x="180" y="172" width="220" height="65" rx="8" fill="#e4eef4"/><text x="215" y="213" font-size="21" fill="#273e50">红色＋圆</text><rect x="425" y="172" width="220" height="65" rx="8" fill="#e4eef4"/><text x="460" y="213" font-size="21" fill="#273e50">红色＋方</text><rect x="670" y="172" width="220" height="65" rx="8" fill="#e4eef4"/><text x="705" y="213" font-size="21" fill="#273e50">红色＋三角</text><text x="65" y="300" font-size="22" fill="#273e50">蓝色</text><rect x="180" y="262" width="220" height="65" rx="8" fill="#e4eef4"/><text x="215" y="303" font-size="21" fill="#273e50">蓝色＋圆</text><rect x="425" y="262" width="220" height="65" rx="8" fill="#e4eef4"/><text x="460" y="303" font-size="21" fill="#273e50">蓝色＋方</text><rect x="670" y="262" width="220" height="65" rx="8" fill="#f3e4cf"/><text x="705" y="303" font-size="21" fill="#273e50">蓝色＋三角</text><text x="670" y="385" font-size="21" fill="#9b6e32">↑ 检查这一格是否漏掉</text><text x="55" y="448" font-size="14" fill="#81909b">方法示意 · 本文编写例题，非课堂实拍</text></g></svg>